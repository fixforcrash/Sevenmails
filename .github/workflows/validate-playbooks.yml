name: Validate Playbooks

on:
  pull_request:
    branches: [main]
    paths:
      - 'playbooks/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pyyaml
      
      - name: Validate Playbook frontmatter
        run: python scripts/validate-frontmatter.py --dir playbooks
      
      - name: Validate Playbook structure
        run: python scripts/validate-playbook-structure.py --dir playbooks