name: Validate SOUL.md

on:
  pull_request:
    branches: [main]
    paths:
      - 'soul-templates/**'
      - 'agent-profiles/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pyyaml
      
      - name: Validate SOUL.md structure
        run: python scripts/validate-soul-md.py --dir soul-templates --dir agent-profiles